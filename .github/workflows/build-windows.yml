name: Сборка установщика для Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Установить NSIS
        run: choco install nsis -y --no-progress
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Moi-uroki-Ustanovshchik
          path: dist/Moi-uroki-Ustanovshchik-*.exe
      - name: Приложить установщик к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Moi-uroki-Ustanovshchik-*.exe
